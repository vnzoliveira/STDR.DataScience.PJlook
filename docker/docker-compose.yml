# Docker Compose for local development and testing
version: '3.8'

services:
  # ML Pipeline (run on-demand)
  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pipeline
    image: fiap-ml-pipeline:latest
    environment:
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - KEY_VAULT_URI=${KEY_VAULT_URI}
    volumes:
      - ../data:/app/data
      - ../reports:/app/reports
      - ../configs:/app/configs
    command: python -m src.cli.main build-all
    profiles:
      - pipeline  # Only run when explicitly specified
  
  # Dashboard (always running)
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    image: fiap-dashboard:latest
    ports:
      - "8060:8060"
    environment:
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - KEY_VAULT_URI=${KEY_VAULT_URI}
      - PORT=8060
    volumes:
      - ../reports:/app/reports:ro
      - ../configs:/app/configs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8060/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  default:
    name: fiap-network


